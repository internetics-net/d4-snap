[project]
name = "d4-snap"
version = "0.1.6"
description = "Clean, safe, professional snapshot manager"
authors = [
    { name = "Pedja Blagojevic", email = "pb@internetics.net" }
]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
d4-snap = "d4_snap.main:run"

[tool.poetry]
packages = [{include = "d4_snap", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pyyaml = "^6.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4.0"
fpdf = "^1.7.2"  # or the latest version
ipykernel = "^6.29.5"
pre-commit = "^4.5.1"
pyinstaller = {version = "^6.18.0", python = ">=3.12,<3.15"}
pytest = "^9.0.3"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E203/E501: formatter; E402: late imports (same ignores as former .flake8)
ignore = ["E203", "E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
